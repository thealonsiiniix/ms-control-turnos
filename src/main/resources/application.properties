spring.application.name=ms-control-turnos
server.port=8084

# H2 en memoria (una base por microservicio)
spring.datasource.url=jdbc:h2:mem:controlturnos
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

# Microservicios a los que llama este servicio
servicios.jugadores.url=http://localhost:8081
servicios.dado.url=http://localhost:8082
servicios.tablero.url=http://localhost:8083
servicios.historial.url=http://localhost:8085
servicios.timeout-ms=3000

# Circuit Breaker: tras N fallos seguidos se "abre" el circuito durante X ms
circuito.umbral-fallos=3
circuito.apertura-ms=10000

# JWT: la clave (HS256, minimo 32 caracteres) debe ser la MISMA en los 5 microservicios.
# En uso real, definir la variable de entorno JWT_SECRET.
jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-al-menos-32-caracteres}
